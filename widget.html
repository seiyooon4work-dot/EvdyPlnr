<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#252923" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="오늘 위젯" />
    <title>오늘 위젯 · 하루기록</title>
    <link rel="manifest" href="./widget.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./widget.css?v=5" />
  </head>
  <body>
    <main class="widget-shell">
      <header class="widget-header">
        <div class="widget-brand">
          <span class="widget-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <div>
            <p class="widget-kicker">하루기록</p>
            <p class="widget-caption">오늘 위젯</p>
          </div>
        </div>
        <a class="widget-open" href="./">기록 열기 <span aria-hidden="true">↗</span></a>
      </header>

      <section class="widget-hero" aria-labelledby="widgetTitle">
        <p id="widgetWeekday" class="widget-eyebrow">TODAY</p>
        <h1 id="widgetTitle">오늘의 흐름</h1>
        <p id="widgetDate" class="widget-date">오늘</p>
        <div class="widget-summary" aria-label="오늘 요약">
          <div><strong id="widgetDoneCount">0</strong><span>한 일</span></div>
          <div><strong id="widgetTaskCount">0</strong><span>남은 일</span></div>
          <div><strong id="widgetReminderCount">0</strong><span>알림</span></div>
        </div>
      </section>

      <section class="widget-card" aria-labelledby="doneWidgetTitle">
        <div class="widget-card-heading">
          <div><p class="widget-eyebrow">DONE</p><h2 id="doneWidgetTitle">한 일</h2></div>
          <span id="doneWidgetTotal" class="widget-count">0개</span>
        </div>
        <ul id="widgetDoneList" class="widget-list" aria-live="polite"></ul>
        <p id="widgetDoneEmpty" class="widget-empty">아직 남긴 한 일이 없어요.</p>
      </section>

      <section class="widget-card" aria-labelledby="taskWidgetTitle">
        <div class="widget-card-heading">
          <div><p class="widget-eyebrow">NEXT</p><h2 id="taskWidgetTitle">다음에 할 일</h2></div>
          <span id="taskWidgetTotal" class="widget-count">0개</span>
        </div>
        <ul id="widgetTaskList" class="widget-list" aria-live="polite"></ul>
        <p id="widgetTaskEmpty" class="widget-empty">남은 일이 없어요.</p>
      </section>

      <section class="widget-card" aria-labelledby="reminderWidgetTitle">
        <div class="widget-card-heading">
          <div><p class="widget-eyebrow">REMINDER</p><h2 id="reminderWidgetTitle">다음 알림</h2></div>
          <span id="reminderWidgetTotal" class="widget-count">0개</span>
        </div>
        <ul id="widgetReminderList" class="widget-list" aria-live="polite"></ul>
        <p id="widgetReminderEmpty" class="widget-empty">정해둔 알림이 없어요.</p>
      </section>

      <section class="widget-card meals-widget" aria-labelledby="mealWidgetTitle">
        <div class="widget-card-heading">
          <div><p class="widget-eyebrow">MEALS</p><h2 id="mealWidgetTitle">오늘 식단</h2></div>
        </div>
        <div id="widgetMeals" class="widget-meals"></div>
      </section>

      <p class="widget-footnote">기록을 바꾸려면 <a href="./">하루기록</a>에서 이어서 적어주세요.</p>
    </main>
    <script src="./widget.js?v=5" defer></script>
  </body>
</html>
